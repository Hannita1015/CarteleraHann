<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./public/css/main.css">
    <script src="./public/js/swal.js"></script>
    <title>Proyecto Final</title>
</head>
<title>Registro</title>
</head>
<body>
    <div class="card-login">
        <h2>REGISTRO</h2>
        <img class="img-centro img-responsiva" src="./public/img/registroimg.gif" alt="logo" auto>
            
            <form id="form_registro">
                <label for="name">Ingresa tu nombre</label>
                <input class="input" type="text" placeholder="Nombre" id="name">
                
                <label for="lastname_p">Ingresa tu apellido paterno</label>
                <input class="input" type="text" placeholder="Apellido Paterno" id="lastname_p">

                <label for="lastname_m">Ingresa tu apellido materno</label>
                <input class="input" type="text" placeholder="Apellido Materno" id="lastname_m">
                
                <label for="email">Ingresa tu correo electrónico</label>
                <input class="input" type="text" placeholder="Correo" id="email">

                <label for="password">Ingresa tu CONTRASEÑA</label>
                <input class="input" type="password" placeholder="contraseña" id="password">

                <button type="button" class="btn-enlace" id="btn_registro">Registrar</button>
            </form>
    </div>

        <div class="card-login">
            <h3>¿Ya tienes una cuenta?, inicia sesión</h3>
            <a href="./login.html" class="btn-enlace">Inicia Sesión</a>
        </div>
    </div>

    <script src="./public/js/registro.js"></script>
</body>
</html>
